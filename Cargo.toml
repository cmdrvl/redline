[package]
name = "redline"
version = "0.1.0"
edition = "2024"
authors = ["CMD+RVL <engineering@cmdrvl.com>"]
description = "Deterministic prose and document diff that reports every change as exact byte spans in the original files."
license = "MIT"
repository = "https://github.com/cmdrvl/redline"
readme = "README.md"
keywords = ["diff", "redline", "html", "provenance", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "redline"
path = "src/lib.rs"

[[bin]]
name = "redline"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
blake3 = { version = "1", default-features = false, features = ["pure"] }
clap = { version = "4", features = ["derive"], optional = true }
entities = "1.0.1"
imara-diff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[dev-dependencies]
jsonschema = { version = "0.63.1", default-features = false }
proptest = "1"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
